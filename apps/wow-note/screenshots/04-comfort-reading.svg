<g fill="#e3e8ed" font-family="sans-serif" font-size="27"><text x="285" y="990">လူတစ်ယောက် ဘဝမှာ ဘာအတွက်လဲမှန်း မသိတော့</text><text x="285" y="1032">ရင် ဘာလုပ်ရမယ်။</text><text x="285" y="1120">တိုးလှုပ်မှ မဟုတ်လေတော့။ ပြဿနာတွေ မရင်နှစ်သုံး။</text><text x="285" y="1210">စာတစ်လမ်းအများ ကြုံနေရတာတွေ ရှိတတ်လို့</text><text x="285" y="1252">အလုပ်ကို တဖြည်းဖြည်း သေချာလုပ်တယ်။</text><text x="285" y="1294">မကြာခဏ ပြန်ဖတ်ပြီး မှတ်စုတွေ သိမ်းထားတယ်။</text><text x="285" y="1384">စာဖတ်ရတာ အဆင်ပြေအောင် Font Size နဲ့</text><text x="285" y="1426">Line Height ကို ကိုယ်ကြိုက်သလို ချိန်နိုင်တယ်။</text><text x="285" y="1516">အဆက်ရှိနေတာတော့ ဟုတ်တယ်။</text></g>
