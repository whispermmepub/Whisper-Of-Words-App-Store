<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="Whisper Of Words App Store — official Android apps from Whisper Of Words.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Whisper Of Words App Store">
  <meta property="og:title" content="Whisper Of Words App Store">
  <meta property="og:description" content="Official Whisper Of Words Android apps with direct APK downloads, screenshots, release notes and app details.">
  <meta property="og:url" content="https://whispermmepub.github.io/Whisper-Of-Words-App-Store/">
  <meta property="og:image" content="https://whispermmepub.github.io/Whisper-Of-Words-App-Store/assets/wow-app-store-logo.jpg">
  <meta property="og:image:secure_url" content="https://whispermmepub.github.io/Whisper-Of-Words-App-Store/assets/wow-app-store-logo.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Whisper Of Words App Store">
  <meta name="twitter:description" content="Official Whisper Of Words Android apps with direct APK downloads.">
  <meta name="twitter:image" content="https://whispermmepub.github.io/Whisper-Of-Words-App-Store/assets/wow-app-store-logo.jpg">
  <link rel="canonical" href="https://whispermmepub.github.io/Whisper-Of-Words-App-Store/">
  <title>Whisper Of Words App Store</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="assets/wow-app-store-logo.jpg">
  <link rel="apple-touch-icon" href="assets/wow-app-store-logo.jpg">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Whisper Of Words App Store home">
      <img class="brand-mark" src="assets/wow-app-store-logo.jpg" alt="" width="42" height="42">
      <span class="brand-copy"><strong>Whisper Of Words</strong><small>App Store</small></span>
    </a>
    <button class="theme-button" id="themeToggle" type="button" aria-label="Toggle theme">◐</button>
  </header>

  <main class="store-page">
    <section class="store-heading">
      <div><p class="kicker">OFFICIAL APPS</p><h1>Discover</h1></div>
      <span id="appCount" class="count-text"></span>
    </section>

    <label class="search-bar">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="Search apps" autocomplete="off">
    </label>

    <section class="section-title-row featured-title-row">
      <h2>Featured</h2><span>Latest release</span>
    </section>
    <section id="featuredApp" class="featured-slot" aria-live="polite"></section>

    <section class="section-title-row" id="catalog">
      <h2>All apps</h2><span>Official builds</span>
    </section>
    <section id="appGrid" class="app-list" aria-live="polite"></section>

    <section class="about-store-card">
      <div class="about-icon">✓</div>
      <div><strong>Direct from Whisper Of Words</strong><p>Trusted APK builds. No account or sign-in required.</p></div>
    </section>
  </main>

  <footer>Whisper Of Words · Independent Android app catalog</footer>
  <script src="store.js?v=6" defer></script>
</body>
</html>
