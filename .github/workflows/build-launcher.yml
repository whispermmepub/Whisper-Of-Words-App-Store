name: Build WoW Ubuntu Launcher

on:
  push:
    branches:
      - launcher-build-v0.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :launcher:assembleDebug --stacktrace

      - name: Copy install APK
        run: cp launcher/build/outputs/apk/debug/launcher-debug.apk WoW-Ubuntu-Launcher-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Ubuntu-Launcher-v0.1
          path: WoW-Ubuntu-Launcher-v0.1.apk
          if-no-files-found: error
