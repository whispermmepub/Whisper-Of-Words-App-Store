name: WoW Reader 100k Experimental Build

on:
  push:
    branches: [reader-exp-100k]
    paths:
      - '.github/workflows/reader-exp-100k.yml'
      - 'reader-exp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build-lab branch
        uses: actions/checkout@v4
        with:
          path: build-lab

      - name: Checkout WoW Reader v63 baseline
        uses: actions/checkout@v4
        with:
          repository: whispermmepub/wow-reader-lab
          ref: 60a0e8640cbcdfd81002367df603aa35acf30d52
          path: reader

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use preinstalled Android SDK and install API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - name: Apply experimental patches
        shell: bash
        run: |
          python3 build-lab/reader-exp/apply.py "$GITHUB_WORKSPACE/reader"
          if compgen -G 'build-lab/reader-exp/patches/*.py' > /dev/null; then
            for patch in $(find build-lab/reader-exp/patches -maxdepth 1 -name '*.py' | sort); do
              echo "Applying $patch"
              python3 "$patch" "$GITHUB_WORKSPACE/reader"
            done
          fi

      - name: Run 100k pure-Java contract tests
        shell: bash
        run: |
          rm -rf /tmp/wow-reader-tests && mkdir -p /tmp/wow-reader-tests
          javac -d /tmp/wow-reader-tests \
            reader/app/src/main/java/com/whisper/wowreader/LibraryQuerySpec.java \
            reader/app/src/main/java/com/whisper/wowreader/DriveObjectNamer.java \
            reader/app/src/main/java/com/whisper/wowreader/SyncBatchPolicy.java \
            reader/app/src/main/java/com/whisper/wowreader/WholeBookPageModel.java \
            build-lab/reader-exp/tests/LibraryQuerySpecTest.java \
            build-lab/reader-exp/tests/IncrementalSyncContractTest.java \
            build-lab/reader-exp/tests/WholeBookPageModelTest.java
          java -cp /tmp/wow-reader-tests com.whisper.wowreader.LibraryQuerySpecTest
          java -cp /tmp/wow-reader-tests com.whisper.wowreader.IncrementalSyncContractTest
          java -cp /tmp/wow-reader-tests com.whisper.wowreader.WholeBookPageModelTest

      - name: Verify package identity
        working-directory: reader
        run: |
          grep -q "applicationId 'com.whisper.wowreader'" app/build.gradle
          grep -q 'versionCode 63' app/build.gradle
          grep -q "versionName '2.19.3'" app/build.gradle

      - name: Build experimental debug APK
        working-directory: reader
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp reader/app/build/outputs/apk/debug/app-debug.apk out/WoW-Reader-v63-100k-experimental-debug.apk
          sha256sum out/WoW-Reader-v63-100k-experimental-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-reader-v63-100k-experimental
          path: out/*
          if-no-files-found: error
          retention-days: 7
